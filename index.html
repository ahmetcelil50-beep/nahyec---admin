<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nahyec Admin Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: white; height: 100vh; overflow: hidden; }
        
        /* Giriş Ekranı */
        #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background-color: #1e1e1e; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; border: 1px solid #333; width: 100%; max-width: 400px; }
        .login-container h1 { color: #ffcc00; margin-bottom: 10px; font-size: 28px; }
        .login-container p { color: #aaa; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; color: #ccc; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; background-color: #2a2a2a; border: 1px solid #444; border-radius: 5px; color: white; font-size: 15px; }
        .form-group input:focus { outline: none; border-color: #ffcc00; }
        
        .login-btn { background-color: #ffcc00; color: #121212; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 15px; transition: 0.3s; width: 100%; }
        .login-btn:hover { background-color: #e6b800; }

        /* Hata Kutusu */
        #error-box { display: none; color: #ff4444; background-color: #3a0000; border: 1px solid #ff4444; padding: 10px; border-radius: 5px; margin-top: 15px; font-size: 14px; font-weight: bold; text-align: center; }

        /* Dashboard */
        #admin-panel { display: none; height: 100vh; display: flex; }
        .sidebar { width: 250px; background-color: #1a1a1a; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-logo { padding: 20px; font-size: 22px; font-weight: bold; color: #ffcc00; text-align: center; border-bottom: 1px solid #333; letter-spacing: 1px; }
        .menu-items { flex: 1; padding: 20px 0; overflow-y: auto; }
        .menu-item { padding: 15px 25px; display: flex; align-items: center; gap: 15px; color: #ccc; text-decoration: none; cursor: pointer; transition: 0.2s; font-size: 15px; border: none; background: none; width: 100%; text-align: left;}
        .menu-item:hover, .menu-item.active { background-color: #2a2a2a; color: #ffcc00; border-left: 4px solid #ffcc00; }
        .logout-btn-sidebar { padding: 20px; border-top: 1px solid #333; color: #ff4444; text-align: center; cursor: pointer; font-weight: bold; border: none; background: none; width: 100%;}
        .logout-btn-sidebar:hover { background-color: #2a2a2a; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background-color: #121212; }
        .top-bar { background-color: #1a1a1a; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .page-title { font-size: 20px; font-weight: 600; }
        .user-profile { display: flex; align-items: center; gap: 15px; font-size: 14px; color: #aaa; }
        .content-area { padding: 30px; }
        .page-section { display: none; }
        .page-section.active { display: block; }
        
        /* İstatistikler ve Formlar */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background-color: #1e1e1e; padding: 25px; border-radius: 10px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .stat-title { font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 32px; font-weight: bold; color: #ffcc00; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #ccc; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; background-color: #2a2a2a; border: 1px solid #444; border-radius: 5px; color: white; font-size: 15px; }
        .btn-primary { background-color: #ffcc00; color: #121212; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-primary:hover { background-color: #e6b800; }
        .content-box { background-color: #1e1e1e; padding: 25px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }
        .content-box h2 { margin-bottom: 20px; color: #eee; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        /* Liste Öğeleri */
        .list-item { background-color: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #ffcc00; flex-wrap: wrap; gap: 10px;}
        .item-info h4 { font-size: 16px; margin-bottom: 5px; color: #fff; }
        .item-info p { font-size: 13px; color: #aaa; word-break: break-all; }
        .item-info span { font-size: 14px; color: #00ff88; font-weight: bold; }
        .btn-delete { background-color: #ff4444; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; }
        
        /* Sipariş ve Kanıt Özel */
        .action-area { display: flex; gap: 10px; margin-top: 10px; align-items: center; width: 100%; }
        .action-input { flex: 1; padding: 10px; background-color: #121212; border: 1px solid #444; border-radius: 5px; color: white; }
        .btn-send { background-color: #00ff88; color: #121212; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .proof-img { width: 100%; max-width: 300px; border-radius: 5px; margin-top: 10px; cursor: pointer; border: 1px solid #555; }
        .btn-approve { background-color: #00ff88; color: #121212; padding: 10px 15px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-reject { background-color: #ff4444; color: white; padding: 10px 15px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; flex: 1; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <div class="login-container">
            <h1>👑 Nahyec Admin</h1>
            <p>Yönetici paneline erişmek için giriş yapın.</p>
            
            <div class="form-group">
                <label>E-posta Adresi</label>
                <input type="email" id="admin-email" placeholder="E-posta adresiniz">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="admin-password" placeholder="••••••••">
            </div>
            <button class="login-btn" id="email-login-btn">Giriş Yap</button>
            <div id="error-box"></div>
        </div>
    </div>
    
    <!-- YÖNETİCİ PANELİ -->
    <div id="admin-panel">
        <aside class="sidebar">
            <div class="sidebar-logo">NAHYEC</div>
            <nav class="menu-items">
                <button class="menu-item active" data-target="overview">📊 Genel Bakış</button>
                <button class="menu-item" data-target="tasks">📝 Görevler</button>
                <button class="menu-item" data-target="proofs">🖼️ Kanıt Onayları</button>
                <button class="menu-item" data-target="store">🛒 Mağaza & Kodlar</button>
                <button class="menu-item" data-target="orders">📦 Siparişler</button>
            </nav>
            <button class="logout-btn-sidebar" id="logout-btn">🚪 Çıkış Yap</button>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title" id="current-page-title">Genel Bakış</div>
                <div class="user-profile">
                    <span id="user-email">Yükleniyor...</span>
                </div>
            </header>
            <div class="content-area">
                
                <!-- GENEL BAKIŞ -->
                <div id="overview" class="page-section active">
                    <div class="stats-grid">
                        <div class="stat-card"><span class="stat-title">Toplam Kullanıcı</span><span class="stat-value">0</span></div>
                        <div class="stat-card"><span class="stat-title">Bekleyen Kanıt</span><span class="stat-value" style="color: #ffaa00;">0</span></div>
                        <div class="stat-card"><span class="stat-title">Dağıtılan NC</span><span class="stat-value" style="color: #00ff88;">0</span></div>
                    </div>
                </div>
                
                <!-- GÖREVLER -->
                <div id="tasks" class="page-section">
                    <div class="content-box">
                        <h2>Yeni Görev Ekle</h2>
                        <form id="add-task-form">
                            <div class="form-group"><label>Görev Adı</label><input type="text" id="task-title" required></div>
                            <div class="form-group"><label>Görev Linki</label><input type="url" id="task-url" required></div>
                            <div class="form-group"><label>Ödül (NC)</label><input type="number" id="task-reward" required></div>
                            <button type="submit" class="btn-primary">Görevi Ekle</button>
                        </form>
                    </div>
                    <div class="content-box">
                        <h2>Sistemdeki Görevler</h2>
                        <div id="task-list"></div>
                    </div>
                </div>

                <!-- MAĞAZA -->
                <div id="store" class="page-section">
                    <div class="content-box">
                        <h2>Yeni Ürün Ekle</h2>
                        <form id="add-store-form">
                            <div class="form-group"><label>Ürün Adı</label><input type="text" id="store-title" required></div>
                            <div class="form-group"><label>Fiyat (NC)</label><input type="number" id="store-price" required></div>
                            <div class="form-group"><label>Stok</label><input type="number" id="store-stock" required></div>
                            <button type="submit" class="btn-primary">Ürünü Ekle</button>
                        </form>
                    </div>
                    <div class="content-box">
                        <h2>Mağazadaki Ürünler</h2>
                        <div id="store-list"></div>
                    </div>
                </div>

                <!-- SİPARİŞLER -->
                <div id="orders" class="page-section">
                    <div class="content-box">
                        <h2>Bekleyen Kod Talepleri</h2>
                        <div id="order-list"></div>
                    </div>
                </div>

                <!-- KANIT ONAYLARI -->
                <div id="proofs" class="page-section">
                    <div class="content-box">
                        <h2>Bekleyen Görev Kanıtları</h2>
                        <div id="proof-list"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>
    
    <!-- FIREBASE BAĞLANTISI VE MANTIK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPv-tO0JDpsoWctNXKPkEyYejJogS8xqs",
            authDomain: "nahyec.firebaseapp.com",
            projectId: "nahyec",
            storageBucket: "nahyec.firebasestorage.app",
            messagingSenderId: "48961284640",
            appId: "1:48961284640:web:33950aab75e5a22d81ea45",
            measurementId: "G-QFKWN2CFWS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Elementler
        const loginScreen = document.getElementById('login-screen');
        const adminPanel = document.getElementById('admin-panel');
        const loginBtn = document.getElementById('email-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userEmailDisplay = document.getElementById('user-email');
        const pageTitle = document.getElementById('current-page-title');
        const menuItems = document.querySelectorAll('.menu-item');
        const pageSections = document.querySelectorAll('.page-section');
        const errorBox = document.getElementById('error-box');

        // GİRİŞ MANTIĞI
        loginBtn.addEventListener('click', () => {
            errorBox.style.display = 'none'; 
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            
            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => {
                    errorBox.style.display = 'block';
                    if(error.code === 'auth/invalid-credential') {
                        errorBox.innerText = "Hata: E-posta veya şifre hatalı!";
                    } else {
                        errorBox.innerText = "Hata: " + error.message;
                    }
                });
        });

        // ÇIKIŞ MANTIĞI
        logoutBtn.addEventListener('click', () => { signOut(auth); });
        
        // OTURUM KONTROLÜ
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.style.display = 'none';
                adminPanel.style.display = 'flex'; 
                userEmailDisplay.textContent = user.email;
                loadTasks(); loadStore(); loadOrders();
            } else {
                loginScreen.style.display = 'flex';
                adminPanel.style.display = 'none';
            }
        });

        // SEKME GEÇİŞLERİ
        menuItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                menuItems.forEach(m => m.classList.remove('active'));
                item.classList.add('active');
                pageTitle.textContent = item.textContent.replace(/[^a-zA-ZğüşıöçĞÜŞİÖÇ\s]/g, '').trim();
                
                const targetId = item.getAttribute('data-target');
                pageSections.forEach(section => { 
                    section.classList.remove('active'); 
                    if (section.id === targetId) section.classList.add('active'); 
                });
                
                if (targetId === 'tasks') loadTasks();
                else if (targetId === 'store') loadStore();
                else if (targetId === 'orders') loadOrders();
                else if (targetId === 'proofs') loadProofs();
            });
        });

        // --- GÖREV İŞLEMLERİ ---
        document.getElementById('add-task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "tasks"), { 
                title: document.getElementById('task-title').value, 
                url: document.getElementById('task-url').value, 
                reward: parseInt(document.getElementById('task-reward').value) 
            });
            alert("Görev Eklendi"); 
            e.target.reset(); 
            loadTasks(); 
        });

        async function loadTasks() {
            const container = document.getElementById('task-list');
            const snapshot = await getDocs(collection(db, "tasks"));
            container.innerHTML = snapshot.empty ? '<p style="color:#aaa;">Görev yok.</p>' : '';
            snapshot.forEach(doc => {
                container.innerHTML += `
                <div class="list-item">
                    <div class="item-info"><h4>${doc.data().title}</h4><span>${doc.data().reward} NC</span></div>
                    <button class="btn-delete" onclick="deleteItem('tasks', '${doc.id}')">Sil</button>
                </div>`;
            });
        }

        // --- MAĞAZA İŞLEMLERİ ---
        document.getElementById('add-store-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "store"), { 
                title: document.getElementById('store-title').value, 
                price: parseInt(document.getElementById('store-price').value), 
                stock: parseInt(document.getElementById('store-stock').value) 
            });
            alert("Ürün Eklendi"); 
            e.target.reset(); 
            loadStore(); 
        });

        async function loadStore() {
            const container = document.getElementById('store-list');
            const snapshot = await getDocs(collection(db, "store"));
            container.innerHTML = snapshot.empty ? '<p style="color:#aaa;">Ürün yok.</p>' : '';
            snapshot.forEach(doc => {
                container.innerHTML += `
                <div class="list-item">
                    <div class="item-info"><h4>${doc.data().title}</h4><p>${doc.data().price} NC - Stok: ${doc.data().stock}</p></div>
                    <button class="btn-delete" onclick="deleteItem('store', '${doc.id}')">Sil</button>
                </div>`;
            });
        }

        // --- SİPARİŞ İŞLEMLERİ ---
        async function loadOrders() {
            const container = document.getElementById('order-list');
            container.innerHTML = '<p style="color:#aaa;">Yükleniyor...</p>';
            const q = query(collection(db, "orders"), where("status", "==", "pending"));
            const snapshot = await getDocs(q);
            container.innerHTML = snapshot.empty ? '<p style="color:#aaa;">Bekleyen sipariş yok.</p>' : '';
            
            snapshot.forEach(doc => {
                const order = doc.data();
                container.innerHTML += `
                <div class="list-item" style="flex-direction: column; align-items: flex-start;">
                    <div class="item-info" style="width:100%; margin-bottom: 10px;">
                        <h4>${order.productName}</h4>
                        <p>Müşteri: ${order.userEmail} | Ödenen: ${order.price} NC</p>
                    </div>
                    <div class="action-area">
                        <input type="text" class="action-input" id="code-input-${doc.id}" placeholder="Play Store Kodu...">
                        <button class="btn-send" onclick="sendCode('${doc.id}')">Gönder</button>
                    </div>
                </div>`;
            });
        }

        window.sendCode = async function(orderId) {
            const code = document.getElementById(`code-input-${orderId}`).value.trim();
            if (!code) { alert("Lütfen bir kod girin!"); return; }
            try {
                await updateDoc(doc(db, "orders", orderId), { status: "completed", deliveredCode: code });
                alert("Kod Gönderildi!"); 
                loadOrders(); 
            } catch (error) { alert("Hata: " + error.message); }
        }

        // --- KANIT ONAY İŞLEMLERİ ---
        async function loadProofs() {
            const container = document.getElementById('proof-list');
            container.innerHTML = '<p style="color:#aaa;">Yükleniyor...</p>';
